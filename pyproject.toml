[build-system]
requires = ["setuptools>=70.1"]
build-backend = "setuptools.build_meta"

[project]
name = "binwalk3"
version = "3.2.0"
description = "Run binwalk v3 from Python through the binwalk v2 API"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "Zachary Flint", email = "zach.flint2@gmail.com" }]
keywords = ["binwalk", "firmware", "reverse-engineering", "binary-analysis", "embedded"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
    "Topic :: Software Development :: Disassemblers",
    "Topic :: System :: Filesystems",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
plot = ["matplotlib>=3.7"]

[project.urls]
Homepage = "https://github.com/ZachFlint/Binwalk3"
Repository = "https://github.com/ZachFlint/Binwalk3"
Issues = "https://github.com/ZachFlint/Binwalk3/issues"
Changelog = "https://github.com/ZachFlint/Binwalk3/blob/master/CHANGELOG.md"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.13",
    "basedpyright>=1.31",
    "pydoclint>=0.7",
    "pydocstyle>=6.3",
    "build>=1.3",
    "matplotlib>=3.7",
    "typing-extensions>=4.12",
    "setuptools>=70.1",
]

[tool.setuptools]
packages = ["binwalk", "binwalk.core", "binwalk.binwalk_bin"]
include-package-data = false

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--tb=short"]

[tool.ruff]
line-length = 100
target-version = "py39"
extend-exclude = ["vendor", "build"]

[tool.ruff.lint]
select = ["ALL"]
ignore = ["D203", "D213", "COM812", "ISC001", "S603", "CPY001"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004", "INP001", "D103"]
"tests/test_readme_examples.py" = ["S102"]
"setup.py" = ["INP001"]
"binwalk/_errors.py" = ["N818"]
"binwalk/_entropy.py" = ["PLC0415"]
"binwalk/core/module.py" = ["PLR0913", "PLR0917", "A002"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.basedpyright]
pythonVersion = "3.9"
typeCheckingMode = "strict"
include = ["binwalk", "tests", "setup.py"]
exclude = ["vendor", "build"]
reportMissingTypeStubs = "none"

[tool.pydoclint]
style = "google"
arg-type-hints-in-docstring = false
check-return-types = false
check-yield-types = false
skip-checking-short-docstrings = false
allow-init-docstring = true
ignore-private-class-attributes = true

[tool.pydocstyle]
convention = "google"
match-dir = "^(?!vendor|build|\\.).*"
